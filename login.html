<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="bootstrap/css/bootstrap.css">
	<link rel="stylesheet" type="text/css" href="Fa/css/all.css">
	<title>Login Page</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<div class="container d-flex justify-content-center align-items-center min-vh-100">
		<div class="row">
			<div class="col">
				<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><img src="Everest bank-logo/logoname.png" alt="not found"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#"><i class="fas fa-phone  mr-3"></i> Contact Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="index.html"><i class="fas fa-home  mr-3"></i> Home</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
			
		<div class="row border rounded-5 p-3 mt-5 bg-white shadow box-area">
			
			<div class="col-md-6 rounded-4 d-flex justify-content-center align-items-center flex-column left box" style="background: #a4031f;">
				<div class="featured-image mb-1">
					<img src="images/photo4.jpg" class="img-fluid" style="width:500px">
					<p class="text-white fs-0.5" style="font-family: Courier New,Courier, monospace;font-weight: 600;">Everest bank</p>
					<small class="text-white text-wrap text-center"style="width:17rem;font-family:Courier New,Courier, monospace ;"><em>Banking you to the top...</em></small>
				</div>

			</div>	

			<div class="col-md-6 right box">
				<div class="row align-items-center">
					<div class="header-text mb-4">

						<h2>Hello, Again</h2>
						<p>We are happy to have you back.</p>
					</div>
						
						<div class="input-group mb-3">
							<input type="Phone number" class="form-control form-control-lg bg-light fs-6" placeholder="Account Number">
						</div>
						<div class="input-group mb-1">
							<input type="password" class="form-control form-control-lg bg-light fs-6" placeholder="password">
						</div>
						<div class="input-group mb-5 d-flex justify-content-between">
							<div class="form-check">
								<input type="checkbox" class="form-check-input"id="form-check">
								<label for="form-check" class="form-check-label text-secondary"><small>Remember Me</small></label>
								
							</div>
								<div class="forgot">
									<small><a href="#">Forgot Password</a></small>

								</div>

								<div class="input-group mb-3">
									<button class="btn btn-lg btn-primary w-100 fs-6">Login</button>
									
								</div>	

								<div class="input-group mb-3">
									<button class="btn btn-lg btn-light w-100 fs-6">Login with Token</button>
									
								</div>
								<div class="row">
									<small>Don't have account? <a href="#">Sign Up</a></small>
									
								</div>	
					
				</div>
					
			</div>



		</div>






	</div>

</body>
</html>
